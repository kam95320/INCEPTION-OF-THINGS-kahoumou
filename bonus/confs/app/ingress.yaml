# Regle sans "host" : c'est la route par defaut de Traefik.
# Le port 8888 de la machine est publie sur le port 80 du load balancer K3d,
# donc "curl http://localhost:8888/" arrive ici.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: playground
  namespace: dev
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: playground
                port:
                  number: 8888
