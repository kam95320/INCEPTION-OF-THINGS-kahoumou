# Identifiants utilises par Argo CD pour cloner le depot du GitLab local.
#
# Le projet est cree en "public", donc ce Secret n'est pas indispensable au
# clone ; il rend la configuration robuste si le projet devient prive et il
# fait apparaitre le depot GitLab dans Settings > Repositories de l'interface
# Argo CD, ce qui rend le lien Argo CD -> GitLab visible.
#
# __GITLAB_PASSWORD__ est remplace a l'execution par deploy_app.sh :
# aucun mot de passe n'est stocke dans le depot.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-local-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: http://gitlab.gitlab.svc.cluster.local:8080/root/iot-kahoumou.git
  username: root
  password: __GITLAB_PASSWORD__
