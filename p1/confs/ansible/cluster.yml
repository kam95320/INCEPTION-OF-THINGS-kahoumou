---
- name: Install K3s server
  hosts: servers
  become: true
  gather_facts: false

  tasks:
    - name: Detect private network interface
      ansible.builtin.shell: |
        ip -o -4 addr show |
        awk '$4 ~ /^{{ ip | regex_escape }}\/[0-9]+$/ {print $2; exit}'
      register: private_iface
      changed_when: false

    - name: Fail if private interface was not found
      ansible.builtin.fail:
        msg: "No interface found with IP {{ ip }}"
      when: private_iface.stdout | length == 0

    - name: Install K3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
        INSTALL_K3S_EXEC="server \
        --node-ip={{ ip }} \
        --advertise-address={{ ip }} \
        --tls-san={{ ip }} \
        --flannel-iface={{ private_iface.stdout }}" \
        sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s server
      ansible.builtin.command:
        cmd: systemctl is-active k3s
      register: k3s_server_status
      retries: 30
      delay: 2
      until: k3s_server_status.stdout == "active"
      changed_when: false

    - name: Read K3s node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_file

    - name: Save K3s token
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_file.content | b64decode | trim }}"

    - name: Create kubeconfig directory
      ansible.builtin.file:
        path: /home/vagrant/.kube
        state: directory
        owner: vagrant
        group: vagrant
        mode: "0755"

    - name: Copy kubeconfig
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/vagrant/.kube/config
        remote_src: true
        owner: vagrant
        group: vagrant
        mode: "0600"


- name: Install K3s workers
  hosts: workers
  become: true
  gather_facts: false

  tasks:
    - name: Detect private network interface
      ansible.builtin.shell: |
        ip -o -4 addr show |
        awk '$4 ~ /^{{ ip | regex_escape }}\/[0-9]+$/ {print $2; exit}'
      register: private_iface
      changed_when: false

    - name: Fail if private interface was not found
      ansible.builtin.fail:
        msg: "No interface found with IP {{ ip }}"
      when: private_iface.stdout | length == 0

    - name: Install K3s agent
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
        K3S_URL="https://{{ hostvars[groups['servers'][0]]['ip'] }}:6443" \
        K3S_TOKEN="{{ hostvars[groups['servers'][0]]['k3s_token'] }}" \
        INSTALL_K3S_EXEC="agent \
        --node-ip={{ ip }} \
        --flannel-iface={{ private_iface.stdout }}" \
        sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s agent
      ansible.builtin.command:
        cmd: systemctl is-active k3s-agent
      register: k3s_agent_status
      retries: 30
      delay: 2
      until: k3s_agent_status.stdout == "active"
      changed_when: false
